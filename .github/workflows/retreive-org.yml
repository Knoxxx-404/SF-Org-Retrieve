name: "Retreive SF Org"
on:
    push:
        branches:
            [ develop, master ]
        paths:
            - 'force-app/**'

        # only one can be used paths or paths-ignore, both can't be used at a time
        # paths-ignore:
        #     - '.github/workflows/**'

    workflow_dispatch:
jobs:
    validate-deployment:
        runs-on: windows-latest
        outputs:
          present_json: ${{ steps.filter.outputs.presentJson }}
        steps:
            - name: Checkout the Code
              uses: actions/checkout@v3
              with:
                ref: ${{ github.event.inputs.source_branch }}

            - name: Debug:Show directory structure
              run: |
                echo "Current directory: $(pwd)"
                ls -la
                ls -la force-app || echo "force-app does not exist"

            - name: Installing sf cli
              run: |
                echo Installing sf...
                curl https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-win32-x64.tar.gz -o sf-linux-x64.tar.gz
                mkdir -p sf-cli
                tar -xzf sf-linux-x64.tar.gz -C sf-cli --strip-components 1
                echo "${PWD}/sf-cli/bin" >> $GITHUB_PATH

            - name: Checking sf cli
              run: sf --version

            - name: Write Auth URL to File
              run: echo "${{ secrets.SF_TRG_SECURITY }}" > dxsecurity

            - name: Authorize Org via Auth URL
              run: |
                sf org login sfdx-url --sfdx-url-file dxsecurity --alias ${{ secrets.SF_TRG_ORG_ALIAS }} --set-default
                echo "Authorized org and set alias to [${{ secrets.SF_TRG_ORG_ALIAS }}]"

            - name: Show Org Details
              run: sf org display --target-org ${{ secrets.SF_TRG_ORG_ALIAS }} --verbose

            - name: Get Metadata List from Org
              id: get_types
              shell: pwsh
              run: |
                # Ask Salesforce for the catalog of types (JSON)

                $raw = sf org list metadata-types --target-org ${{ secrets.SF_TRG_ORG_ALIAS }} --api-version 64.0 --json
                $obj = $raw | ConvertFrom-Json

                # Pull just the type names (xmlName) into a PowerShell array

                $types = $obj.result.metadataObjects | ForEach-Object { $_.xmlName }

                # Save a text file (optional, for download)

                $types | Set-Content supported-types.txt -Encoding utf8

                # Also keep as JSON array (single line) for later steps

                $typesJson = $types | ConvertTo-Json -Compress
                "json=$typesJson" >> $env:GITHUB_OUTPUT

            # 2) From that list, keep ONLY the types that have ≥1 item in the org    
            - name: Filter to types that actually exist (≥1 item)
              id: filter
              shell: pwsh
              env:
                ORG_ALIAS: ${{ secrets.SF_TRG_ORG_ALIAS }}
              run: |
                # Function to run sf command and return result[] as array
                function SfJson([string[]]$Args) {
                  try {
                    $raw = & sf @Args --json
                    if (-not $raw) { return @() }
                    $obj = $raw | ConvertFrom-Json
                    if ($null -eq $obj -or $null -eq $obj.result) { return @() }
                    if ($obj.result -is [System.Array]) { return $obj.result } else { return @($obj.result) }
                  } catch { return @() }
                }
              
                # Rehydrate the type list from previous step
                $types = '${{ steps.get_types.outputs.json }}' | ConvertFrom-Json
              
                # Foldered metadata map
                $folderMap = @{
                  Report        = @('ReportFolder')
                  Dashboard     = @('DashboardFolder')
                  Document      = @('DocumentFolder')
                  EmailTemplate = @('EmailTemplateFolder','EmailFolder')
                }
              
                # This will store only the types that are present
                $present = @()
              
                foreach ($t in $types) {
                  if ($folderMap.ContainsKey($t)) {
                    # For foldered types, loop folders
                    $found = $false
                    foreach ($ft in $folderMap[$t]) {
                      $folders = SfJson @('org','list','metadata','-m',"$ft",'-o',"$env:ORG_ALIAS")
                      foreach ($f in $folders) {
                        $fname = $f.fullName
                        if ([string]::IsNullOrWhiteSpace($fname)) { continue }
                        $items = SfJson @('org','list','metadata','-m',"$t",'--folder',"$fname",'-o',"$env:ORG_ALIAS")
                        if ($items.Count -gt 0) {
                          $found = $true
                          break
                        }
                      }
                      if ($found) { break }
                    }
                    if ($found) { $present += $t }
                  }
                  else {
                      # Non-foldered: one check
                      $items = SfJson @('org','list','metadata','-m',"$t",'-o',"$env:ORG_ALIAS")
                      if ($items.Count -gt 0) { $present += $t }
                  }
                }
              
                # Save the list to a file (optional)
                $present | Sort-Object | Set-Content present-types.txt
              
                # Output as JSON array
                "presentJson=$($present | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT